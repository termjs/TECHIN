<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Tab</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="card_container">
      <div class="card_banner">
        <div class="card_profile_picture">
          <img
            src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
            width="200px"
            height="500px"
            alt="Your profile picture"
          />
        </div>
      </div>
      <div class="card_details">
        <h3>CodingLab</h3>
        <p>YouTuber & Blogger</p>
        <div class="card_socials">
          <a href="https://facebook.com" target="_blank" rel="noopener"
            ><i class="fa-brands fa-facebook-f" aria-hidden="true"></i
          ></a>
          <a href="https://twitter.com" target="_blank" rel="noopener"
            ><i class="fa-brands fa-twitter" aria-hidden="true"></i
          ></a>
          <a href="https://youtube.com" target="_blank" rel="noopener"
            ><i class="fa-brands fa-youtube" aria-hidden="true"></i
          ></a>
          <a href="https://instagram.com" target="_blank" rel="noopener"
            ><i class="fa-brands fa-instagram" aria-hidden="true"></i
          ></a>
        </div>
        <div class="card_action_buttons">
          <button>Subscribe</button>
          <button>Message</button>
        </div>
        <div class="card_account_insight">
          <div class="insight">
            <i class="fa-solid fa-heart"></i><span>60.4k</span>
          </div>
          <div class="spacer"></div>
          <div class="insight">
            <i class="fa-solid fa-comment"></i><span>20k</span>
          </div>
          <div class="spacer"></div>
          <div class="insight">
            <i class="fa-solid fa-share"></i><span>12.4k</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
