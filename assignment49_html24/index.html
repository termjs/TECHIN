<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Praktika 6</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="hero">
      <img
        class="hero-bg"
        src="https://images.unsplash.com/photo-1580865767741-37cd59206d74?q=80&w=849&auto=format&fit=crop"
        alt=""
      />
      <div class="hero-text">
        <span class="icon">&#9670;</span>
        <p class="kicker">Welcome to</p>
        <h1>Classic<br />Style</h1>
        <p class="sub">Heritage &amp; Tradition</p>
      </div>
    </header>

    <main class="mosaic">
      <section class="band">
        <div class="cluster">
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1578014400463-5b6ed42adea4?q=80&w=687&auto=format&fit=crop"
              alt="Photo"
              loading="lazy"
            />
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Heritage</h3>
            <span class="line"></span>
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Pure<br />Quality</h3>
            <span class="line"></span>
          </div>
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1595590424283-b8f17842773f?q=80&w=1170&auto=format&fit=crop"
              alt="Dark boxes"
              loading="lazy"
            />
          </div>
        </div>
        <div class="tile photo big">
          <img
            src="https://images.unsplash.com/photo-1610165539774-791ae89d0574?q=80&w=687&auto=format&fit=crop"
            alt="Lacing boots"
            loading="lazy"
          />
        </div>
      </section>
      <section class="band">
        <div class="tile photo big">
          <img
            src="https://images.unsplash.com/photo-1582043963563-7e145bd9db07?w=500&auto=format&fit=crop&q=60"
            alt="Man on a rock"
            loading="lazy"
          />
          <h2 class="big-title">A Man<br />Alone</h2>
        </div>
        <div class="cluster">
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1580865767741-37cd59206d74?q=80&w=849&auto=format&fit=crop"
              alt="Pipe"
              loading="lazy"
            />
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Old<br />School</h3>
            <span class="line"></span>
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Night<br />Watch</h3>
            <span class="line"></span>
          </div>
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1564993719576-7b00be6317cd?q=80&w=1169&auto=format&fit=crop"
              alt="Revolver"
              loading="lazy"
            />
          </div>
        </div>
      </section>
      <section class="band">
        <div class="cluster">
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1758751945250-b1bb1d6caeee?q=80&w=687&auto=format&fit=crop"
              alt="Campfire"
              loading="lazy"
            />
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Into<br />The Wild</h3>
            <span class="line"></span>
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Hand<br />Made</h3>
            <span class="line"></span>
          </div>
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1780404421779-c21b31f022c2?q=80&w=687&auto=format&fit=crop"
              alt="Workbench"
              loading="lazy"
            />
          </div>
        </div>
        <div class="tile photo big">
          <img
            src="https://images.unsplash.com/photo-1578014400463-5b6ed42adea4?q=80&w=687&auto=format&fit=crop"
            alt="Helmet"
            loading="lazy"
          />
          <h2 class="big-title">Stay<br />Sharp</h2>
        </div>
      </section>
      <section class="band">
        <div class="tile photo big">
          <img
            src="https://images.unsplash.com/photo-1595590424283-b8f17842773f?q=80&w=1170&auto=format&fit=crop"
            alt="Beard"
            loading="lazy"
          />
          <h2 class="big-title">Stand<br />Tall</h2>
        </div>
        <div class="cluster">
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1610165539774-791ae89d0574?q=80&w=687&auto=format&fit=crop"
              alt="Brick wall"
              loading="lazy"
            />
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Classic<br />Club</h3>
            <span class="line"></span>
          </div>
          <div class="tile text">
            <span class="icon">&#9670;</span>
            <h3>Weekend<br />Style</h3>
            <span class="line"></span>
          </div>
          <div class="tile photo">
            <img
              src="https://images.unsplash.com/photo-1582043963563-7e145bd9db07?w=500&auto=format&fit=crop&q=60"
              alt="Tools"
              loading="lazy"
            />
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <nav>
        <a href="#">About</a><a href="#">Contact</a><a href="#">Shop</a
        ><a href="#">Archive</a>
      </nav>
      <p>— Handcrafted Quality &amp; Tradition —</p>
    </footer>
  </body>
</html>
