<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filmai</title>
    <style>
      p {
        width: 150px;
        height: 100px;
        padding: 10px;
        margin: 5px;
        display: inline;
      }

      p:first-of-type {
        background-color: rgb(255, 234, 0);
      }

      p:nth-of-type(2) {
        background-color: rgb(152, 152, 152);
      }

      p:last-of-type {
        background-color: rgba(198, 66, 29, 0.943);
      }
    </style>
  </head>
  <body>
    <h1>Mano mėgstamiausi filmai</h1>
    <p>The Godfather (1972)</p>
    <p>12 Angry Men (1957)</p>
    <p>Citizen Kane (1941)</p>
  </body>
</html>
